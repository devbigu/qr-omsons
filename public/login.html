<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Omsons QR Labels</title>
  <meta name="theme-color" content="#06349b">
  <link rel="icon" href="/assets/logo.png">
  <style>
    :root {
      color-scheme: light;
      --brand: #06349b;
      --brand-600: #0a3fb8;
      --brand-500: #1552d8;
      --ink: #131a26;
      --ink-2: #3a4658;
      --muted: #66748c;
      --faint: #94a0b4;
      --line: #dfe5ef;
      --danger: #b42318;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(14px, 4vw, 40px);
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 16%, rgba(21, 82, 216, 0.16), transparent 30rem),
        radial-gradient(circle at 88% 82%, rgba(16, 135, 106, 0.12), transparent 28rem),
        linear-gradient(150deg, #eef3fd 0%, #f7f9fd 50%, #eaf3f0 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes rise {
      from { opacity: 0; transform: translate3d(0, 16px, 0); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    main {
      width: min(100%, 430px);
      padding: clamp(26px, 5vw, 40px);
      border: 1px solid rgba(223, 229, 239, 0.9);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 70px rgba(19, 26, 38, 0.14);
      animation: rise 520ms var(--ease-out) both;
    }

    main > * { animation: rise 520ms var(--ease-out) both; }
    main > *:nth-child(1) { animation-delay: 60ms; }
    main > *:nth-child(2) { animation-delay: 110ms; }
    main > *:nth-child(3) { animation-delay: 160ms; }
    main > *:nth-child(4) { animation-delay: 210ms; }

    .brand {
      display: block;
      width: 148px;
      max-width: 55%;
      height: auto;
      margin-bottom: 26px;
      transition: transform 260ms var(--spring);
    }

    .brand:hover { transform: scale(1.03); }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(25px, 6.5vw, 32px);
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14.5px;
    }

    form { display: grid; gap: 18px; }

    label {
      display: grid;
      gap: 7px;
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-weight: 450;
      outline: none;
      transition: border-color 130ms ease, box-shadow 130ms ease;
    }

    input::placeholder { color: var(--faint); }
    input:hover { border-color: #c6d0e0; }

    input:focus {
      border-color: var(--brand-500);
      box-shadow: 0 0 0 3px rgba(21, 82, 216, 0.18);
    }

    button {
      position: relative;
      min-height: 46px;
      border: 0;
      border-radius: 9px;
      color: #fff;
      background: var(--brand);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(19, 26, 38, 0.12);
      transition: background 130ms ease, transform 130ms ease, box-shadow 200ms ease;
    }

    button:hover { background: var(--brand-600); box-shadow: 0 8px 22px rgba(6, 52, 155, 0.26); }
    button:active { transform: translateY(1px) scale(0.995); }

    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(21, 82, 216, 0.35);
    }

    button:disabled { cursor: wait; color: transparent; }

    button:disabled::after {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
      width: 17px;
      height: 17px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 620ms linear infinite;
    }

    .error {
      min-height: 20px;
      margin: -4px 0 0;
      color: var(--danger);
      font-size: 13.5px;
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="https://omsonsnsicom.yolasite.com/" alt="Omsons Germany" width="331" height="208"
         onerror="this.onerror=null;this.src='/assets/logo.png'">
    <h1>Welcome back</h1>
    <p>Sign in to manage products, labels, lots, and certificates.</p>

    <form id="loginForm">
      <label>
        Username
        <input id="username" name="username" type="text" autocomplete="username" autofocus required>
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div class="error" id="loginError" role="alert" aria-live="polite"></div>
      <button id="submitButton" type="submit">Sign in</button>
    </form>
  </main>

  <script>
    const form = document.querySelector("#loginForm");
    const error = document.querySelector("#loginError");
    const button = document.querySelector("#submitButton");

    function safeNextPath(value) {
      return value && value.startsWith("/") && !value.startsWith("//") ? value : "/";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      button.disabled = true;

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.querySelector("#username").value,
            password: document.querySelector("#password").value
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Invalid credentials");

        const next = safeNextPath(new URLSearchParams(window.location.search).get("next"));
        window.location.assign(next);
      } catch (loginError) {
        error.textContent = loginError.message || "Invalid credentials";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
